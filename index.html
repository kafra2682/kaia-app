<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaia AI - Ultimate V15.0</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --text-color: #c5c6c7;
            --accent-color: #45f3ff;
            --accent-glow: #0b8793;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }
        
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
        }
        .lock-container {
            background: rgba(31, 40, 51, 0.9); padding: 30px; border-radius: 15px;
            box-shadow: 0 0 25px rgba(69, 243, 255, 0.2); border: 1px solid var(--accent-color);
            text-align: center; width: 100%; max-width: 350px;
        }
        .lock-container h2 { color: #fff; margin-bottom: 10px; font-size: 24px; }
        .lock-container p { font-size: 12px; color: #85929E; margin-bottom: 20px; }
        .password-input {
            width: 100%; padding: 12px; border: 1px solid #45f3ff; background: #0b0c10;
            color: #fff; border-radius: 8px; text-align: center; font-size: 16px; margin-bottom: 15px; outline: none;
        }
        .btn-unlock {
            width: 100%; padding: 12px; background: var(--accent-color); color: #0b0c10;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        #app-container { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; }
        header {
            background-color: var(--panel-color); padding: 15px; display: flex;
            align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(69, 243, 255, 0.2);
        }
        .profile-area { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent-color); background: #2c5364; }
        .status-info h1 { font-size: 16px; color: #fff; }
        .status-info p { font-size: 11px; color: var(--accent-color); }
        .api-config-trigger { font-size: 11px; color: #85929E; border: 1px solid #85929E; padding: 4px 8px; border-radius: 4px; cursor: pointer; background: transparent; }
        
        #chat-box {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%); padding-bottom: 140px; 
        }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .message.kaia { background-color: var(--panel-color); color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.creator { background: linear-gradient(135deg, var(--accent-color), var(--accent-glow)); color: #0b0c10; align-self: flex-end; font-weight: 500; border-bottom-right-radius: 2px; }
        .message.system-error { background-color: #7b241c; color: #fff; align-self: center; font-size: 13px; border-radius: 8px; padding: 8px; }
        
        .input-wrapper { position: absolute; bottom: 45px; left: 0; width: 100%; padding: 0 15px; z-index: 99; }
        .input-container { display: flex; background: rgba(31, 40, 51, 0.95); border: 1px solid rgba(69, 243, 255, 0.4); border-radius: 30px; padding: 6px 12px; align-items: center; }
        .chat-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px; font-size: 16px; resize: none; }
        .btn-send { background: var(--accent-color); border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-left: 8px; cursor: pointer; }
        .btn-send svg { width: 18px; height: 18px; fill: #0b0c10; }
    </style>
</head>
