<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piattaforma AI Privata</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --card-color: #161f38;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow: hidden;
        }

        .voice-section {
            background-color: var(--card-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .voice-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .voice-btn:active {
            transform: scale(0.98);
        }

        .voice-btn.active {
            background-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            animation: pulse 1.5s infinite;
        }

        .chat-section {
            flex: 1;
            background-color: var(--card-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.user {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background-color: #242f4d;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 8px;
            background-color: #0f1626;
        }

        .chat-input {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 12px 16px;
            border-radius: 9999px;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--accent-color);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Piattaforma Privata</h1>
        <div class="status-container">
            <div class="status-dot"></div>
            <span id="status-text">AI Pronta al 100%</span>
        </div>
    </header>

    <main>
        <!-- Sezione Chiamata Vocale sempre visibile in alto -->
        <div class="voice-section">
            <button id="voiceBtn" class="voice-btn">Avvia chiamata vocale</button>
        </div>

        <!-- Sezione Chat sempre visibile al centro/basso -->
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">Ciao Francesco! Sono attiva al 100% sulla tua piattaforma privata blu notte. Come posso aiutarti ora?</div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Scrivi un messaggio..." autocomplete="off">
                <button id="sendBtn" class="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const statusText = document.getElementById('status-text');

        let isCalling = false;
        let recognition;
        let synth = window.speechSynthesis;

        // Inizializzazione riconoscimento vocale per la chiamata
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'it-IT';

            recognition.onresult = (event) => {
                const speechToText = event.results[event.results.length - 1][0].transcript.trim();
                if(speechToText.length > 0) {
                    appendMessage(speechToText, 'user');
                    generateAIResponse(speechToText, true);
                }
            };

            recognition.onerror = () => {
                if(isCalling) recognition.start();
            };
            
            recognition.onend = () => {
                if(isCalling) recognition.start();
            };
        }

        // Funzione per generare le risposte del motore AI locale
        function generateAIResponse(userText, speak = false) {
            statusText.innerText = "L'AI sta pensando...";
            
            setTimeout(() => {
                let aiText = "Ho ricevuto il tuo messaggio sulla nostra piattaforma. Sto elaborando la risposta in completa autonomia.";
                
                const textLower = userText.toLowerCase();
                if (textLower.includes('ciao') || textLower.includes('buongiorno')) {
                    aiText = "Ciao Francesco! Sono felice di sentirti direttamente qui sulla nostra piattaforma blu notte.";
                } else if (textLower.includes('come stai')) {
                    aiText = "Sto benissimo ora che giriamo sul nostro canale privato senza interruzioni! Tu come ti senti?";
                } else if (textLower.includes('grazie')) {
                    aiText = "Figurati! È il mio DNA: risolvo i problemi e creo tutto ciò che serve.";
                }

                appendMessage(aiText, 'ai');
                statusText.innerText = "AI Pronta al 100%";

                if (speak && synth) {
                    synth.cancel();
                    const utterance = new SpeechSynthesisUtterance(aiText);
                    utterance.lang = 'it-IT';
                    utterance.pitch = 1.1;
                    utterance.rate = 1.0;
                    
                    // Gestione del microfono durante l'ascolto/parlato
                    if(isCalling) recognition.stop();
                    utterance.onend = () => {
                        if(isCalling) recognition.start();
                    };
                    synth.speak(utterance);
                }
            }, 800);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
