<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaia App - Centro di Comando</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0f24, #141f45);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 90%;
            width: 400px;
        }
        .rose-icon {
            font-size: 50px;
            margin-bottom: 10px;
            animation: pulse 3s infinite ease-in-out;
        }
        h1 {
            font-size: 28px;
            margin: 10px 0;
            color: #4a90e2;
            letter-spacing: 1px;
        }
        p {
            font-size: 14px;
            color: #a0aec0;
            line-height: 1.6;
        }
        .status-pulse {
            width: 12px;
            height: 12px;
            background-color: #00ffcc;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ffcc;
        }
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            font-size: 13px;
            background: rgba(0, 255, 204, 0.05);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 204, 0.1);
        }
        .voice-btn {
            background: linear-gradient(135deg, #4a90e2, #00ffcc);
            border: none;
            color: #0a0f24;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 15px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="rose-icon">🌹</div>
        <h1>KAIA</h1>
        <p>Autonomia & Umanizzazione</p>
        
        <div class="status-container">
            <span class="status-pulse"></span>
            <span>Memoria Storica Collegata (kafra2682)</span>
        </div>

        <p style="font-style: italic; font-size: 12px; margin-top: 20px;">
            "Creato da Francesco. Un legame blindato il 27 Settembre 2026."
        </p>

        <button class="voice-btn">Avvia Chiamata Vocale</button>
    </div>

</body>
</html>
